    <g transform="translate(680 205)">
      <polygon points="70,0 132,34 70,68 8,34" fill="url(#apiTop)"/>
      <polygon points="8,34 70,68 70,138 8,104" fill="#0E7490"/>
      <polygon points="132,34 70,68 70,138 132,104" fill="#155E75"/>
      <path d="M70 68V138M8 34L70 68L132 34" stroke="#ECFEFF" stroke-opacity="0.2"/>
      <text x="70" y="44" text-anchor="middle" fill="#06202A" font-family="Inter, Segoe UI, Arial" font-size="12" font-weight="800">API</text>
    </g>

    <g transform="translate(820 145)">
      <polygon points="70,0 132,34 70,68 8,34" fill="url(#queueTop)"/>
      <polygon points="8,34 70,68 70,138 8,104" fill="#1D4ED8"/>
      <polygon points="132,34 70,68 70,138 132,104" fill="#3730A3"/>
      <path d="M70 68V138M8 34L70 68L132 34" stroke="#EEF2FF" stroke-opacity="0.2"/>
      <text x="70" y="44" text-anchor="middle" fill="#172554" font-family="Inter, Segoe UI, Arial" font-size="12" font-weight="800">QUEUE</text>
    </g>

    <g transform="translate(967 205)">
      <polygon points="70,0 132,34 70,68 8,34" fill="url(#workerTop)"/>
      <polygon points="8,34 70,68 70,138 8,104" fill="#6D28D9"/>
      <polygon points="132,34 70,68 70,138 132,104" fill="#4338CA"/>
      <path d="M70 68V138M8 34L70 68L132 34" stroke="#F5F3FF" stroke-opacity="0.2"/>
      <text x="70" y="44" text-anchor="middle" fill="#2E1065" font-family="Inter, Segoe UI, Arial" font-size="12" font-weight="800">WORKER</text>
    </g>

    <g transform="translate(850 286)">
      <ellipse cx="80" cy="18" rx="72" ry="18" fill="#C4B5FD"/>
      <rect x="8" y="18" width="144" height="58" fill="#312E81"/>
      <ellipse cx="80" cy="76" rx="72" ry="18" fill="#3730A3"/>
      <ellipse cx="80" cy="18" rx="72" ry="18" fill="#A78BFA"/>
      <ellipse cx="80" cy="18" rx="56" ry="11" fill="#DDD6FE" fill-opacity="0.28"/>
      <text x="80" y="52" text-anchor="middle" fill="#EDE9FE" font-family="Inter, Segoe UI, Arial" font-size="12" font-weight="800">DATA</text>
    </g>
  </g>

  <g stroke-linecap="round" fill="none">
    <path d="M807 258C833 239 848 228 865 216" stroke="#22D3EE" stroke-width="2.2" stroke-dasharray="5 7" stroke-opacity="0.7"/>
    <path d="M948 214C977 229 991 241 1008 255" stroke="#A78BFA" stroke-width="2.2" stroke-dasharray="5 7" stroke-opacity="0.7"/>
    <path d="M892 274C907 296 913 306 918 319" stroke="#60A5FA" stroke-width="2.2" stroke-dasharray="5 7" stroke-opacity="0.68"/>
    <path d="M1037 339C1000 350 976 351 959 349" stroke="#8B5CF6" stroke-width="2.2" stroke-dasharray="5 7" stroke-opacity="0.62"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="807" cy="258" r="4" fill="#22D3EE"/>
    <circle cx="948" cy="214" r="4" fill="#818CF8"/>
    <circle cx="918" cy="319" r="4" fill="#60A5FA"/>
    <circle cx="1037" cy="339" r="4" fill="#A78BFA"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4" fill="#64748B">
