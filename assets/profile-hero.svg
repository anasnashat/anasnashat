<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1160" y2="405" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050A12"/>
      <stop offset="0.48" stop-color="#08111F"/>
      <stop offset="1" stop-color="#0E1024"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(895 145) rotate(150) scale(370 250)">
      <stop stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1030 330) rotate(-155) scale(350 180)">
      <stop stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="60" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="apiTop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="queueTop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="workerTop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#94A3B8" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020617" flood-opacity="0.56"/>
    </filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="32" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="32" fill="url(#cyanGlow)"/>
  <rect width="1200" height="420" rx="32" fill="url(#violetGlow)"/>

  <g opacity="0.8">
    <circle cx="52" cy="44" r="4" fill="#22D3EE"/>
    <circle cx="69" cy="44" r="4" fill="#334155"/>
    <circle cx="86" cy="44" r="4" fill="#334155"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="58" y="104" fill="#64748B" font-size="14" font-weight="700" letter-spacing="3.6">BACKEND ENGINEER / BUILDER / TOOLMAKER</text>
    <text x="58" y="164" fill="#F8FAFC" font-size="46" font-weight="800" letter-spacing="0.2">ANAS NASHAT AHMED</text>
    <text x="59" y="205" fill="#CBD5E1" font-size="23" font-weight="600">I build systems people can reason about.</text>
    <rect x="59" y="230" width="418" height="4" rx="2" fill="url(#accent)"/>
    <text x="59" y="276" fill="#94A3B8" font-size="16" font-weight="500">APIs, multi-tenant SaaS, developer tools, queues, CI/CD.</text>
    <text x="59" y="310" fill="#94A3B8" font-size="16" font-weight="500">Clean enough to change. Practical enough to ship.</text>

    <g font-size="12" font-weight="700" letter-spacing="1.4">
      <rect x="58" y="342" width="95" height="30" rx="15" fill="#0E2232" stroke="#22D3EE" stroke-opacity="0.35"/>
      <text x="81" y="362" fill="#67E8F9">LARAVEL</text>
      <rect x="163" y="342" width="92" height="30" rx="15" fill="#141A38" stroke="#818CF8" stroke-opacity="0.35"/>
      <text x="188" y="362" fill="#A5B4FC">NESTJS</text>
      <rect x="265" y="342" width="117" height="30" rx="15" fill="#101D2A" stroke="#38BDF8" stroke-opacity="0.3"/>
      <text x="285" y="362" fill="#BAE6FD">POSTGRESQL</text>
      <rect x="392" y="342" width="86" height="30" rx="15" fill="#17152B" stroke="#A78BFA" stroke-opacity="0.32"/>
      <text x="416" y="362" fill="#C4B5FD">DOCKER</text>
    </g>
  </g>

  <g filter="url(#shadow)">
