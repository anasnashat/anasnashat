<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="34" y1="18" x2="1168" y2="409" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B12"/>
      <stop offset="0.55" stop-color="#0A101B"/>
      <stop offset="1" stop-color="#091326"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#20C8FF"/>
      <stop offset="0.5" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#2149C8"/>
    </linearGradient>
    <linearGradient id="line" x1="70" y1="0" x2="485" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20C8FF"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(975 180) rotate(153) scale(390 270)">
      <stop stop-color="#2F6BFF" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#20C8FF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#20C8FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#94A3B8" stroke-opacity="0.045"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="30" fill="url(#glow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="62" y="86" fill="#64748B" font-size="13" font-weight="700" letter-spacing="3.4">BACKEND ENGINEER · SYSTEMS · PRODUCTS</text>

    <text x="60" y="151" fill="#F8FAFC" font-size="50" font-weight="800" letter-spacing="-0.4">ANAS NASHAT</text>
    <text x="61" y="191" fill="#60A5FA" font-size="21" font-weight="700">Build. Scale. Solve.</text>

    <text x="61" y="243" fill="#CBD5E1" font-size="17" font-weight="500">I design backend systems that stay understandable as they grow.</text>
    <text x="61" y="273" fill="#94A3B8" font-size="15" font-weight="500">APIs · Multi-tenant SaaS · Developer tooling · Queues · CI/CD</text>

    <rect x="61" y="307" width="420" height="3" rx="1.5" fill="url(#line)"/>

    <g font-size="11" font-weight="700" letter-spacing="1.25">
      <rect x="61" y="334" width="91" height="30" rx="15" fill="#0E2232" stroke="#20C8FF" stroke-opacity="0.25"/>
      <text x="85" y="354" fill="#67E8F9">LARAVEL</text>

      <rect x="162" y="334" width="87" height="30" rx="15" fill="#101B35" stroke="#60A5FA" stroke-opacity="0.28"/>
      <text x="185" y="354" fill="#93C5FD">NESTJS</text>

      <rect x="259" y="334" width="116" height="30" rx="15" fill="#101B2C" stroke="#38BDF8" stroke-opacity="0.24"/>
      <text x="279" y="354" fill="#BAE6FD">POSTGRESQL</text>

      <rect x="385" y="334" width="87" height="30" rx="15" fill="#111827" stroke="#64748B" stroke-opacity="0.3"/>
      <text x="408" y="354" fill="#CBD5E1">DOCKER</text>
    </g>
  </g>

  <g transform="translate(704 68)" filter="url(#softShadow)">
    <rect x="15" y="12" width="400" height="286" rx="34" fill="#FFFFFF" fill-opacity="0.025" stroke="#FFFFFF" stroke-opacity="0.07"/>

    <!-- depth echoes -->
    <path d="M82 229L158 60L234 229" stroke="#162235" stroke-width="35" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <path d="M239 229V91L329 229V91" stroke="#162235" stroke-width="35" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

    <!-- AN mark -->
    <path d="M73 220L149 51L225 220" stroke="#F8FAFC" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M123 152H234" stroke="url(#blue)" stroke-width="28" stroke-linecap="round"/>
    <path d="M230 220V82L320 220V82" stroke="#F8FAFC" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M282 147L320 82" stroke="url(#blue)" stroke-width="22" stroke-linecap="round"/>

    <circle cx="378" cy="57" r="5" fill="#20C8FF"/>
    <circle cx="397" cy="57" r="5" fill="#2F6BFF" fill-opacity="0.45"/>

    <text x="72" y="270" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.8">ARCHITECTURE → AUTOMATION → DELIVERY</text>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="29" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
</svg>