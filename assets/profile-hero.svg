<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="45" y1="20" x2="1110" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#0B132B"/>
      <stop offset="1" stop-color="#11142B"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(955 126) rotate(146) scale(335 220)">
      <stop stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(815 305) rotate(-38) scale(315 170)">
      <stop stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="30" fill="url(#glowA)"/>
  <rect width="1200" height="360" rx="30" fill="url(#glowB)"/>

  <g opacity="0.78">
    <circle cx="55" cy="50" r="4" fill="#22D3EE"/>
    <circle cx="72" cy="50" r="4" fill="#334155"/>
    <circle cx="89" cy="50" r="4" fill="#334155"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="62" y="112" fill="#94A3B8" font-size="15" font-weight="700" letter-spacing="3">BACKEND / SYSTEMS / TOOLS</text>
    <text x="60" y="169" fill="#F8FAFC" font-size="43" font-weight="800" letter-spacing="0.4">ANAS NASHAT AHMED</text>
    <text x="61" y="209" fill="#CBD5E1" font-size="23" font-weight="600">Backend Software Engineer</text>
    <rect x="61" y="235" width="380" height="4" rx="2" fill="url(#accent)"/>
    <text x="61" y="278" fill="#94A3B8" font-size="17" font-weight="500">I turn messy backend problems into clean, reusable systems.</text>
    <text x="61" y="314" fill="#64748B" font-size="14" font-weight="600" letter-spacing="1.6">APIs   •   SaaS   •   DEVELOPER TOOLS   •   AUTOMATION</text>
  </g>

  <g filter="url(#shadow)">
    <ellipse cx="935" cy="302" rx="190" ry="31" fill="#020617" fill-opacity="0.36"/>

    <g transform="translate(830 58)">
      <polygon points="100,0 185,47 100,94 15,47" fill="url(#topFace)"/>
      <polygon points="15,47 100,94 100,194 15,147" fill="url(#leftFace)"/>
      <polygon points="185,47 100,94 100,194 185,147" fill="url(#rightFace)"/>
      <path d="M100 94V194M15 47L100 94L185 47" stroke="#E0F2FE" stroke-opacity="0.22" stroke-width="1.5"/>
      <circle cx="100" cy="45" r="10" fill="#E0F2FE" fill-opacity="0.9" filter="url(#softGlow)"/>
    </g>

    <g transform="translate(735 160) scale(.72)">
      <polygon points="100,0 185,47 100,94 15,47" fill="#22D3EE" fill-opacity="0.88"/>
      <polygon points="15,47 100,94 100,194 15,147" fill="#0E7490"/>
      <polygon points="185,47 100,94 100,194 185,147" fill="#164E63"/>
      <path d="M100 94V194M15 47L100 94L185 47" stroke="#ECFEFF" stroke-opacity="0.2" stroke-width="1.5"/>
    </g>

    <g transform="translate(1002 167) scale(.68)">
      <polygon points="100,0 185,47 100,94 15,47" fill="#A78BFA" fill-opacity="0.94"/>
      <polygon points="15,47 100,94 100,194 15,147" fill="#5B21B6"/>
      <polygon points="185,47 100,94 100,194 185,147" fill="#3730A3"/>
      <path d="M100 94V194M15 47L100 94L185 47" stroke="#F5F3FF" stroke-opacity="0.2" stroke-width="1.5"/>
    </g>
  </g>

  <g stroke-linecap="round">
    <path d="M842 219 C865 196 882 191 900 184" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="5 8"/>
    <path d="M1011 226 C987 202 971 194 954 187" stroke="#8B5CF6" stroke-opacity="0.58" stroke-width="2" stroke-dasharray="5 8"/>
    <circle cx="842" cy="219" r="4" fill="#22D3EE"/>
    <circle cx="1011" cy="226" r="4" fill="#A78BFA"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">
    <text x="767" y="306" fill="#67E8F9">API</text>
    <text x="913" y="286" fill="#BAE6FD">CORE</text>
    <text x="1081" y="310" fill="#C4B5FD">DATA</text>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="29" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
</svg>